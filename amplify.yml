version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run prebuild
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  rewrites:
    - from: "/data/<*>"
      to: "/data/"
      status: 200
    - from: "<!.(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|json)$>"
      to: "/index.html"
      status: 200